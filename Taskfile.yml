version: '3'

env:
  GOMAXPROCS: '1'
  GOFLAGS: '-p=1'

tasks:
  test:
    desc: 运行正在迁移的 Go 客户端与同步服务测试
    cmds:
      - go -C client test -p 1 -count 1 ./...
      - go -C server test -p 1 -count 1 ./...
  build:client:
    desc: 编译 MyGo 原生客户端
    cmds:
      - go -C client tool mygo build -skip-installer -o ../build/mygo
  build:server:
    desc: 编译同步服务
    cmds:
      - go -C server build -p 1 -o ../build/terminal233-server ./cmd/server
  test:desktop:windows:
    desc: 静音验证 Windows 原生窗口和本机测试 SSH 连接
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File client/test-desktop.ps1 -Quiet
  test:desktop:drop:
    desc: 静音验证 Windows 原生 OLE 批量拖放与重名处理
    cmds:
      - pwsh -NoProfile -File client/test-native-drop.ps1 -Quiet
  test:edge:
    desc: 验证 Cloudflare 边缘适配器的转发与签名
    cmds:
      - node --test server/deploy/edge-worker.test.mjs
  package:windows:local:
    desc: 生成未签名 Windows 安装包
    cmds:
      - go -C client tool mygo build -platform windows/amd64 -o ../build/release-windows
  build:server:linux-amd64:
    desc: 构建 Linux amd64 同步服务
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go -C server build -o ../build/linux-amd64/terminal233-server ./cmd/server
  build:server:linux-arm64:
    desc: 构建 Linux arm64 同步服务
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: '0'
    cmds:
      - go -C server build -o ../build/linux-arm64/terminal233-server ./cmd/server
  package:release:
    desc: 从干净且已推送的 main 构建并校验发布资产
    cmds:
      - pwsh -NoProfile -File client/package-release.ps1
