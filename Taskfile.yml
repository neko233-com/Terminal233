version: '3'

env:
  GOMAXPROCS: '1'
  GOFLAGS: '-p=1'

tasks:
  test:
    desc: 运行正在迁移的 Go 客户端与同步服务测试
    cmds:
      - go -C client test -p 1 ./...
      - go -C server test -p 1 ./...
  build:client:
    desc: 编译 MyGo 原生客户端
    cmds:
      - go -C client tool mygo build -skip-installer -o ../build/mygo
  build:server:
    desc: 编译同步服务
    cmds:
      - go -C server build -p 1 -o ../build/terminal233-server ./cmd/server
  test:desktop:windows:
    desc: 静音验证 Windows 原生窗口和本机测试 SSH 连接
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File client/test-desktop.ps1 -Quiet
  package:windows:local:
    desc: 生成仅用于本机验证的未签名 Windows 安装包
    cmds:
      - go -C client tool mygo build -platform windows/amd64 -o ../build/unsigned-local
