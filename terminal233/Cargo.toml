[package]
name = "terminal233"
version = "0.2.0"
description = "A security-first SSH workspace for Terminal233"
authors = ["Terminal233 contributors"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/neko233-com/Terminal233"

[lib]
name = "terminal233_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.23.0"
puressh = { path = "vendor/puressh", version = "=0.1.3", default-features = false, features = ["std", "client", "multichannel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }
rdesktop-core = { git = "https://github.com/neko233-com/rdesktop", rev = "e9ad03a14f6519a730389a00ba25f2337ba6f3be", version = "=0.1.6" }
rdesktop-webview = { git = "https://github.com/neko233-com/rdesktop", rev = "e9ad03a14f6519a730389a00ba25f2337ba6f3be", version = "=0.1.6" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
