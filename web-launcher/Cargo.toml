[package]
name = "nekossh-web-launcher"
version = "0.2.0"
description = "Native Windows launcher for the independent NekoSSH Web macOS runtime"
authors = ["NekoSSH contributors"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/neko233-com/nekossh"

[[bin]]
name = "nekossh-web"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
