name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate GitHub Actions
        shell: pwsh
        run: ./scripts/validate-github-actions.ps1 -ForceBootstrap

  web:
    name: Web runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm 12.0.1
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund

      - name: Confirm pinned JavaScript toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "12.0.1"

      - name: Install locked dependencies
        run: npm ci

      - name: Build Tauri renderer isolation bundle
        run: npm run build

      - name: Build Web runtime isolation bundle
        run: npm run web:build

      - name: Test Web and renderer code
        run: npm test

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

  rust-windows:
    name: Rust SSH runtime (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1
      npm_config_ignore_scripts: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
          if ((rustc --version) -notmatch '^rustc 1\.97\.1 ') { throw 'Rust 1.97.1 is required.' }
          if ((cargo --version) -notmatch '^cargo 1\.97\.1 ') { throw 'Cargo 1.97.1 is required.' }

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm 12.0.1
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund

      - name: Install locked renderer dependencies
        run: npm ci

      - name: Confirm vendored OpenSSL build prerequisites
        shell: pwsh
        run: |
          perl --version
          perl -MLocale::Maketext::Simple -e "print qq(Perl modules ready\n)"
          nasm -v

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust SSH runtime
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test Rust SSH runtime
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features

      - name: Build NSIS and MSI release bundles
        run: npm run tauri:bundle

      - name: Assert Windows release artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File)) {
            throw 'NSIS installer was not generated.'
          }
          if (-not (Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -File)) {
            throw 'MSI installer was not generated.'
          }

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
